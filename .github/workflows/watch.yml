name: Watch targets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Two overlapping runs would both read the same sheet state and could
# double-post duplicate Slack notifications.
concurrency:
  group: watch-targets
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run basedpyright

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Check targets and notify Slack on change
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: uv run python scripts/check_targets.py
