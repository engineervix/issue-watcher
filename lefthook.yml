pre-commit:
  commands:
    ruff:
      glob:
        - "scripts/*.py"
        - "tests/*.py"
      run: uv run ruff check {staged_files}
    basedpyright:
      glob:
        - "scripts/*.py"
        - "tests/*.py"
      run: uv run basedpyright
    tests:
      glob:
        - "scripts/*.py"
        - "tests/*.py"
      run: uv run python -m unittest discover -s tests
